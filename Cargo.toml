[package]
name = "cocbot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Rust desktop automation framework for Clash of Clans farming and loot tracking"
license = "MIT"
repository = "https://github.com/frasersimpson126/Cocbot-rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.7"
enigo = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
